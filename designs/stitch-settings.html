<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>COINQUEST - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Custom CSS for specific Neo-Brutalist Arcade Behaviors -->
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #14130f; /* Overridden by brand paper */
        }
        
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        
        .active-press:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }

        .segmented-progress div {
            height: 12px;
            width: 8px;
            background: #12a35a;
            border: 1px solid black;
        }

        /* Material Symbols Customization */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Block Cursor Animation */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .block-cursor::after {
            content: "█";
            animation: blink 1s step-start infinite;
            margin-left: 2px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#b6a4ff",
                        "on-surface-variant": "#cac4d2",
                        "surface-tint": "#cbbeff",
                        "surface": "#14130f",
                        "secondary-container": "#ffc01e",
                        "tertiary": "#12a35a",
                        "shadow-black": "#000000",
                        "on-tertiary-fixed": "#00210f",
                        "on-secondary": "#14130f",
                        "outline": "#14130f",
                        "on-error": "#ffffff",
                        "tertiary-container": "#12a35a",
                        "on-secondary-fixed-variant": "#594400",
                        "outline-variant": "#484551",
                        "paper": "#fffdf7",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#2b2a25",
                        "inverse-surface": "#e7e2db",
                        "on-primary-container": "#473588",
                        "on-background": "#14130f",
                        "surface-container": "#21201b",
                        "card-surface": "#ffffff",
                        "loss-red": "#e23b2e",
                        "surface-container-highest": "#363530",
                        "surface-variant": "#363530",
                        "surface-bright": "#3b3934",
                        "on-tertiary-container": "#004e2b",
                        "error-container": "#e23b2e",
                        "on-tertiary-fixed-variant": "#00522e",
                        "primary": "#5b3df0",
                        "on-secondary-container": "#14130f",
                        "error": "#e23b2e",
                        "on-primary-fixed": "#1e015f",
                        "inverse-on-surface": "#32302c",
                        "primary-fixed-dim": "#cbbeff",
                        "secondary": "#ffc01e",
                        "ink": "#14130f",
                        "on-secondary-fixed": "#241a00",
                        "background": "#fffdf7",
                        "tertiary-fixed-dim": "#56df92",
                        "tertiary-fixed": "#75fcac",
                        "secondary-fixed-dim": "#ffc01e",
                        "on-surface": "#14130f",
                        "on-primary-fixed-variant": "#4a398c",
                        "on-primary": "#ffffff",
                        "on-error-container": "#ffffff",
                        "secondary-fixed": "#ffdf92",
                        "surface-dim": "#fffdf7",
                        "inverse-primary": "#6251a5",
                        "primary-fixed": "#e7deff",
                        "deep-surface": "#0d0c09",
                        "surface-container-lowest": "#0f0e0a",
                        "surface-container-low": "#1d1c17"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "xl": "40px",
                        "border-width": "3px",
                        "base": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "shadow-offset": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Space Grotesk"],
                        "amount-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "display": ["Space Grotesk"],
                        "label-md": ["Space Grotesk"],
                        "body-md": ["Space Grotesk"],
                        "mono-num": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", {"lineHeight": "31px", "fontWeight": "700"}],
                        "amount-lg": ["36px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "24px", "fontWeight": "700"}],
                        "display": ["40px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["13px", {"lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "mono-num": ["15px", {"lineHeight": "18px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-paper text-on-background min-h-screen pb-xl">
<!-- TOP HEADER -->
<header class="sticky top-0 z-50 bg-ink text-white p-lg flex items-center justify-between border-b-[3px] border-ink neo-shadow">
<div class="flex items-center gap-md">
<button class="active-press">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'wght' 700;">chevron_left</span>
</button>
<h1 class="font-headline-lg text-headline-lg uppercase tracking-tight">SETTINGS</h1>
</div>
<div class="w-8 h-8 border-[2px] border-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-xs">close</span>
</div>
</header>
<main class="p-lg space-y-xl max-w-md mx-auto">
<!-- MONEY SECTION -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md uppercase text-on-background/60">MONEY</h2>
<!-- Monthly Budget Card -->
<div class="bg-card-surface border-[3px] border-ink p-md neo-shadow flex justify-between items-center">
<div>
<p class="font-label-md text-label-md uppercase mb-xs">MONTHLY BUDGET</p>
<p class="font-amount-lg text-amount-lg tracking-tighter">50,000<span class="text-secondary">.00</span></p>
</div>
<button class="w-12 h-12 bg-primary border-[3px] border-ink neo-shadow active-press flex items-center justify-center">
<span class="material-symbols-outlined text-white">edit</span>
</button>
</div>
<!-- Currency Selection -->
<div class="bg-card-surface border-[3px] border-ink p-md neo-shadow space-y-md">
<p class="font-label-md text-label-md uppercase">CURRENCY</p>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm bg-ink text-white border-[3px] border-ink font-label-md text-label-md">₹ INR</button>
<button class="px-md py-sm bg-white text-ink border-[3px] border-ink font-label-md text-label-md active-press neo-shadow transition-all hover:bg-paper">$ USD</button>
<button class="px-md py-sm bg-white text-ink border-[3px] border-ink font-label-md text-label-md active-press neo-shadow transition-all hover:bg-paper">€ EUR</button>
<button class="px-md py-sm bg-white text-ink border-[3px] border-ink font-label-md text-label-md active-press neo-shadow transition-all hover:bg-paper">£ GBP</button>
</div>
</div>
</section>
<!-- APPEARANCE SECTION -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md uppercase text-on-background/60">APPEARANCE</h2>
<div class="bg-card-surface border-[3px] border-ink p-md neo-shadow flex justify-between items-center">
<p class="font-label-md text-label-md uppercase">THEME</p>
<div class="flex gap-sm">
<button class="px-md py-xs bg-ink text-white border-[3px] border-ink font-label-md text-label-md uppercase">LIGHT</button>
<button class="px-md py-xs bg-paper text-ink/30 border-[3px] border-ink/30 font-label-md text-label-md uppercase flex items-center gap-xs cursor-not-allowed">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
                        DARK
                        <span class="text-[9px] bg-secondary text-ink px-1 leading-none ml-1">SOON</span>
</button>
</div>
</div>
</section>
<!-- CAPTURE SECTION -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md uppercase text-on-background/60">CAPTURE</h2>
<!-- Manual Entry Toggle -->
<div class="bg-card-surface border-[3px] border-ink p-md neo-shadow flex justify-between items-center">
<p class="font-label-md text-label-md uppercase">MANUAL ENTRY</p>
<button class="w-16 h-8 bg-tertiary border-[3px] border-ink p-[2px] transition-colors relative" onclick="this.classList.toggle('bg-tertiary'); this.classList.toggle('bg-paper');">
<div class="h-full aspect-square bg-ink absolute right-[2px]" id="manual-toggle-knob"></div>
</button>
</div>
<!-- Auto-Capture Row -->
<div class="bg-paper/50 border-[3px] border-ink/20 p-md flex justify-between items-center">
<p class="font-label-md text-label-md uppercase text-ink/40">AUTO-CAPTURE FROM GMAIL/SMS</p>
<span class="bg-ink text-white font-label-md text-[10px] px-sm py-xs uppercase">COMING SOON</span>
</div>
</section>
<!-- DATA SECTION -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md uppercase text-on-background/60">DATA</h2>
<button class="w-full bg-white border-[3px] border-ink p-md neo-shadow active-press text-left flex justify-between items-center">
<span class="font-label-md text-label-md uppercase">EXPORT DATA (.CSV)</span>
<span class="material-symbols-outlined">download</span>
</button>
<button class="w-full bg-white border-[3px] border-loss-red p-md neo-shadow active-press text-left flex justify-between items-center group transition-colors hover:bg-loss-red">
<span class="font-label-md text-label-md uppercase text-loss-red group-hover:text-white">RESET ALL DATA</span>
<span class="material-symbols-outlined text-loss-red group-hover:text-white">warning</span>
</button>
</section>
<!-- ABOUT SECTION -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md uppercase text-on-background/60">ABOUT</h2>
<div class="bg-card-surface border-[3px] border-ink p-md neo-shadow">
<div class="flex justify-between items-start mb-sm">
<h3 class="font-headline-md text-headline-md uppercase tracking-tight">COINQUEST</h3>
<span class="font-mono-num text-mono-num bg-secondary px-sm">v1.0.0</span>
</div>
<p class="font-body-md text-body-md text-ink/80 leading-tight block-cursor">Made for the quest to spend wisely.</p>
<div class="mt-lg pt-md border-t-[1px] border-ink/10 flex justify-between items-center">
<div class="flex gap-xs">
<div class="w-2 h-2 bg-primary"></div>
<div class="w-2 h-2 bg-secondary"></div>
<div class="w-2 h-2 bg-tertiary"></div>
<div class="w-2 h-2 bg-loss-red"></div>
</div>
<p class="font-label-md text-[10px] uppercase opacity-40">System Terminal Active</p>
</div>
</div>
</section>
</main>
<!-- FLOATING STATUS (Gamified Decor) -->
<div class="fixed bottom-4 right-4 z-40">
<div class="bg-ink text-white border-[3px] border-white p-xs neo-shadow active-press cursor-pointer flex items-center gap-sm">
<div class="w-3 h-3 bg-tertiary animate-pulse"></div>
<span class="font-label-md text-[10px] pr-xs">SYNCED: OK</span>
</div>
</div>
<script>
        // Simple micro-interaction for the toggle
        const toggleBtn = document.querySelector('button[onclick*="manual-toggle-knob"]');
        if(toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const knob = this.querySelector('#manual-toggle-knob');
                if(this.classList.contains('bg-tertiary')) {
                    knob.style.right = '2px';
                    knob.style.left = 'auto';
                } else {
                    knob.style.left = '2px';
                    knob.style.right = 'auto';
                }
            });
        }

        // Add physical response sound effects simulation via console for arcade feel
        document.querySelectorAll('.active-press').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                console.log('%c [COINQUEST] MECHANICAL_INPUT_DETECTED ', 'background: #5b3df0; color: #fff');
            });
        });
    </script>
</body></html>
