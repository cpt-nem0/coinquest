<body class="font-body-md text-brand-black min-h-screen flex flex-col pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-brand-paper pixel-border-b flex justify-between items-center px-gutter py-4">

<div class="w-10 h-10 pixel-border bg-primary-container flex items-center justify-center neo-shadow-sm">

</div>
<div>

</div>
</div>
<div class="flex items-center gap-2">
<div class="bg-brand-paper pixel-border px-3 py-1 flex items-center gap-2 neo-shadow-sm">
<img alt="Gold pixel coin indicating currency balance" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida/AP1WRLsGtNvP848GwLjrP3pLw5t8f4FB2_ZlfGN65u3TRVytV8PlsL6kxwLwp8vqonlfPwAW5OYAnJdmJv8hKI-_AxR9QxcpI2wejWYo_V2B1gU5trtaD9mea6Ltzbxy0TPhmcSVhehrZfp-QSE-Bqx3HMeg15lrBujNhVSKTCoAQ0s44mX1dIPVsLdBtwXyPWgrfM66SI2GsqhCotgAmuYlcstChO3OP9emoxPGRSTuTR9r_CcRjVixn9oYLJE">

</div>
<div class="bg-brand-black text-white px-2 py-1 font-label-sm text-label-sm">
                LVL 12
            </div>
</div>
</header>
<main class="flex-grow px-gutter py-6 max-w-lg mx-auto w-full">
<!-- Mode Toggle -->
<div class="flex mb-8 pixel-border bg-brand-black p-1 neo-shadow">
<button class="flex-1 py-3 text-center bg-brand-violet text-white font-headline-lg-mobile text-headline-lg-mobile uppercase tracking-wider">
                ADD MANUALLY
            </button>
<button class="flex-1 py-3 text-center text-white font-headline-lg-mobile text-headline-lg-mobile uppercase tracking-wider">
                REVIEW (2)
            </button>
</div>
<!-- Transaction Type -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="pixel-border py-4 bg-brand-red text-white flex items-center justify-center gap-2 neo-shadow active-press">
<span class="material-symbols-outlined">arrow_downward</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">SPENT</span>
</button>
<button class="pixel-border py-4 bg-transparent text-brand-green flex items-center justify-center gap-2 neo-shadow-sm active-press">
<span class="material-symbols-outlined">arrow_upward</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">RECEIVED</span>
</button>
</div>
<!-- Amount Section -->
<div class="mb-8">
<label class="block font-label-sm text-label-sm mb-2 uppercase opacity-70">AMOUNT</label>
<div class="relative">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-primary text-4xl font-headline-xl">₹</div>
<input class="w-full pixel-border bg-white p-6 pl-12 text-5xl font-body-lg tabular-nums neo-shadow focus:outline-none focus:ring-0" placeholder="0" type="text">
</div>
</div>
<!-- Merchant Section -->
<div class="mb-8">
<label class="block font-label-sm text-label-sm mb-2 uppercase opacity-70">MERCHANT</label>
<input class="w-full pixel-border bg-white p-4 font-body-md neo-shadow-sm focus:outline-none focus:ring-0" placeholder="e.g. Swiggy" type="text">
</div>
<!-- Category Section -->
<div class="mb-8">
<label class="block font-label-sm text-label-sm mb-2 uppercase opacity-70">CATEGORY</label>
<div class="flex flex-wrap gap-2">
<button class="pixel-border px-4 py-2 bg-brand-violet text-white font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Food &amp; Dining</button>
<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Shopping</button>
<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Transport</button>
<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Groceries</button>

<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Entertainment</button>
<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Health</button>
<button class="pixel-border px-4 py-2 bg-white text-brand-black font-label-sm text-label-sm uppercase neo-shadow-sm active-press">Other</button>
</div>
</div>
<!-- Date Section -->
<div class="mb-12 flex items-center gap-4">
<label class="font-label-sm text-label-sm uppercase opacity-70">DATE:</label>
<button class="pixel-border bg-white px-4 py-1 font-label-sm text-label-sm flex items-center gap-2 neo-shadow-sm active-press">
<span class="material-symbols-outlined text-sm">calendar_today</span>
                TODAY
            </button>
</div>
<!-- CTA Button -->
<button class="w-full bg-brand-violet text-white pixel-border py-6 text-xl font-headline-lg uppercase tracking-widest neo-shadow-lg active-press mb-12">
            ADD TO LEDGER
        </button>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-end h-20 bg-surface-container-low px-2 pb-safe pixel-border-t shadow-[0px_-4px_0px_0px_rgba(0,0,0,1)]">

<a class="flex flex-col items-center justify-center text-on-surface-variant pb-3 active:scale-95 transition-transform duration-100 hover:text-primary" href="#">

<span class="material-symbols-outlined text-3xl font-bold" data-icon="add">add</span>

</div>
<a class="flex flex-col items-center justify-center text-on-surface-variant pb-3 active:scale-95 transition-transform duration-100 hover:text-primary" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-sm text-[10px] mt-1">LEDGER</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant pb-3 active:scale-95 transition-transform duration-100 hover:text-primary" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-[10px] mt-1">HERO</span>
</a>
</nav>
<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('translate-x-1', 'translate-y-1');
                input.style.boxShadow = 'none';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('translate-x-1', 'translate-y-1');
                input.style.boxShadow = '';
            });
        });

        // Toggle logic simulation
        const categoryChips = document.querySelectorAll('.flex-wrap button');
        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => {
                    c.classList.remove('bg-brand-violet', 'text-white');
                    c.classList.add('bg-white', 'text-brand-black');
                });
                chip.classList.add('bg-brand-violet', 'text-white');
                chip.classList.remove('bg-white', 'text-brand-black');
            });
        });
    </script>


</body></html>
