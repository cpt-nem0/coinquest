<!-- MODAL OVERLAY (THE VICTORY MODAL) -->

<p class="font-label-md text-label-md text-[#14130f]/40 pt-md italic uppercase">Tap anywhere to return to Dashboard</p>
</div>

</div>
<script>
        // Micro-interaction for clicking the claim button
        document.querySelector('button').addEventListener('click', function(e) {
            e.stopPropagation();
            const btn = this.querySelector('div');
            btn.innerHTML = 'REWARD COLLECTED!';
            setTimeout(() => {
                document.querySelector('.fixed.inset-0.z-\\[100\\]').style.opacity = '0';
                setTimeout(() => {
                    document.querySelector('.fixed.inset-0.z-\\[100\\]').style.display = 'none';
                    document.querySelector('.fixed.inset-0.z-0').classList.remove('opacity-50', 'pointer-events-none');
                }, 300);
            }, 500);
        });

        // Close modal when clicking background
        document.querySelector('.fixed.inset-0.z-\\[100\\]').addEventListener('click', function() {
            this.style.opacity = '0';
            setTimeout(() => {
                this.style.display = 'none';
            }, 300);
        });
    </script>
