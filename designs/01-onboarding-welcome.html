<style>

            100% { transform: translateX(-50%); }

            display: flex;

<script>
        // Simple micro-interaction for the coin on mouse move
        document.addEventListener('mousemove', (e) => {
            const coin = document.querySelector('img[src*="IMAGE_39"]');
            if (coin) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                coin.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) scale(1.05)`;
            }
        });

        // Reset coin orientation
        document.addEventListener('mouseleave', () => {
            const coin = document.querySelector('img[src*="IMAGE_39"]');
            if (coin) {
                coin.style.transform = `rotateY(0deg) rotateX(0deg) scale(1)`;
            }
        });
    </script>
