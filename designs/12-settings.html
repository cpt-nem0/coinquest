<style>
        body {
            background-color: #fffdf7;
            color: #14130f;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .brutalist-card {
            border: 3px solid #14130f;
            background-color: #ffffff;
            box-shadow: 4px 4px 0px 0px #000000;
            transition: all 0.1s ease;
        }

        .brutalist-card:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        .brutalist-button {
            border: 3px solid #14130f;
            box-shadow: 4px 4px 0px 0px #000000;
            transition: all 0.1s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .brutalist-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        .mono-numerals {
            font-variant-numeric: tabular-nums;
        }

        .toggle-switch {
            width: 52px;
            height: 28px;
            border: 3px solid #14130f;
            position: relative;
            background-color: #f1eee4;
            cursor: pointer;
        }

        .toggle-switch.active {
            background-color: #5b3df0;
        }

        .toggle-handle {
            width: 20px;
            height: 16px;
            background-color: #14130f;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.1s steps(2);
        }

        .toggle-switch.active .toggle-handle {
            transform: translateX(20px);
            background-color: #ffffff;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 24;
        }

        .nav-item-active {
            background-color: #5b3df0;
            color: #ffffff;
            border: 2px solid #14130f;
            box-shadow: 2px 2px 0px 0px #000000;
            padding: 4px;
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-paper min-h-screen flex flex-col no-scrollbar">
<!-- TopAppBar -->

</div>

<script>
        // Simple toggle script for demo
        document.querySelectorAll('.toggle-switch').forEach(toggle => {
            toggle.addEventListener('click', () => {
                toggle.classList.toggle('active');
            });
        });
