<script>
        function selectAvatar(element) {
            // Remove selection from all
            document.querySelectorAll('button[onclick="selectAvatar(this)"]').forEach(btn => {
                btn.classList.remove('selected-avatar');
                const check = btn.querySelector('.absolute.top-1');
                if (check) check.remove();
            });
            
            // Add selection to clicked
            element.classList.add('selected-avatar');
            
            // Add checkmark
            const checkmark = document.createElement('div');
            checkmark.className = 'absolute top-1 right-1 bg-arcade-violet text-white neo-border w-6 h-6 flex items-center justify-center';
            checkmark.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
            element.appendChild(checkmark);
        }

        // Budget formatting logic (mockup)
        const budgetInput = document.querySelector('input[value="₹50,000"]');
        budgetInput.addEventListener('input', (e) => {
            // Clean non-numeric except symbols
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val) {
                e.target.value = '₹' + parseInt(val).toLocaleString('en-IN');
            }
        });
    </script>
